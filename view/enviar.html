      <div class="contacto box zoom-in" id="contacto" action="view\enviar.php" method="POST">

    <script>
      // CONFIGURE AQUI
      const EMAIL_DESTINO = "as3904844@gmail.com";
      const WHATS_NUMERO = "258860162805"; // formato internacional, sem + nem espaços

      function montaTexto() {
        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const msg = document.getElementById('mensagem').value.trim();
        const bloco = `Nome: ${nome}\nEmail: ${email}\n\nMensagem:\n${msg}`;
        return encodeURIComponent(bloco);
      }

      document.getElementById('enviarEmail').addEventListener('click', () => {
        const assunto = encodeURIComponent('Contato pelo site');
        const corpo = montaTexto();
        const link = `mailto:${EMAIL_DESTINO}?subject=${assunto}&body=${corpo}`;
        window.location.href = link;
      });

      document.getElementById('enviarWhats').addEventListener('click', () => {
        const texto = montaTexto();
        const link = `https://wa.me/${WHATS_NUMERO}?text=${texto}`;
        window.open(link, '_blank', 'noopener');
      });
    </script>
