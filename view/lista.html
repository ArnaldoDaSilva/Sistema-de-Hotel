<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Lista de Reservas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    .search-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .search-box input {
      padding: 8px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .reserva-card {
      background: #fff;
      padding: 15px;
      margin: 10px auto;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      transition: 0.3s;
      position: relative;
    }

    .reserva-card:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
    }

    .reserva-card h3 {
      margin: 0 0 10px;
      color: #2980b9;
    }

    .reserva-card p {
      margin: 4px 0;
      color: #34495e;
    }

    .delete-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      position: absolute;
      top: 15px;
      right: 15px;
      transition: 0.3s;
    }

    .delete-btn:hover {
      background: #c0392b;
    }
  </style>
</head>

<body>
  <h2>Lista de Reservas</h2>

  <div class="search-box">
    <input type="text" id="searchBi" placeholder="Buscar cliente pelo BI...">
  </div>

  <div id="lista-reservas"></div>

  <script>
    // Buscar reservas do localStorage
    let reservas = JSON.parse(localStorage.getItem("reserva")) || [];

    const lista = document.getElementById("lista-reservas");
    const searchInput = document.getElementById("searchBi");

    // Função para salvar no localStorage
    function salvarReservas() {
      localStorage.setItem("reserva", JSON.stringify(reservas));
    }

    // Função para deletar reserva pelo BI
    function deletarReserva(bi) {
      reservas = reservas.filter(r => r.Bi !== bi);
      salvarReservas();
      mostrarReservas(searchInput.value); // atualizar a tela mantendo o filtro
    }

    // Função para exibir as reservas
    function mostrarReservas(filtro = "") {
      lista.innerHTML = ""; // limpa antes de mostrar
      reservas
        .filter(r => r.Bi.includes(filtro)) // filtra pelo BI digitado
        .forEach(reserva => {
          const card = document.createElement("div");
          card.className = "reserva-card";
          card.innerHTML = `
            <h3>${reserva.cliente}</h3>
            <p><strong>Email:</strong> ${reserva.email}</p>
            <p><strong>BI:</strong> ${reserva.Bi}</p>
            <p><strong>Quarto:</strong> ${reserva.quarto}</p>
            <p><strong>Check-in:</strong> ${reserva.checkin}</p>
            <p><strong>Check-out:</strong> ${reserva.checkout}</p>
            <p><strong>Pessoas:</strong> ${reserva.pessoa}</p>
          `;

          // Botão de excluir
          const btn = document.createElement("button");
          btn.textContent = "Eliminar";
          btn.className = "delete-btn";
          btn.onclick = () => deletarReserva(reserva.Bi);

          card.appendChild(btn);
          lista.appendChild(card);
        });
    }

    // Mostrar todas no início
    mostrarReservas();

    // Atualizar ao digitar na busca
    searchInput.addEventListener("input", (e) => {
      mostrarReservas(e.target.value);
    });
  </script>
</body>

</html>
