<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuário</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #2980b9, #6dd5fa);
      min-height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #fff;
      padding: 32px 36px 28px 36px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(44, 62, 80, 0.15);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #2980b9;
      margin-bottom: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-top: 16px;
      color: #34495e;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #b2bec3;
      border-radius: 6px;
      font-size: 1rem;
      background: #f7fafd;
      transition: border 0.2s;
    }

    input:focus {
      border: 1.5px solid #2980b9;
      outline: none;
      background: #eaf6fb;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 12px 0;
      background: linear-gradient(90deg, #2980b9, #6dd5fa);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(52, 152, 219, 0.08);
    }

    button:hover {
      background: linear-gradient(90deg, #2574a9, #48c6ef);
    }

    .success {
      color: #27ae60;
      margin-top: 22px;
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Registro de Usuário</h2>
    <form id="registerForm">
      <input type="text" id="nome" placeholder="Nome" required><br>
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="senha" placeholder="Senha" required><br>
      <button type="submit">Registrar</button>
    </form>

    <p id="successMsg" style="color: green;"></p>

    <script>
      const users = [
        { email: "admin@empresa.com", password: "12345", role: "funcionario", nome: "Administrador" },
        { email: "cliente@empresa.com", password: "abcde", role: "cliente", nome: "Arnaldo Silva" }
      ];

      // Carregar registros já salvos
      let registros = JSON.parse(localStorage.getItem("registros")) || [];

      // Registro de novo usuário
      document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;

        // Criar novo registro
        const novoRegistro = { nome, email, senha, role: "cliente" };

        // Adicionar no array registros
        registros.push(novoRegistro);

        // Salvar no localStorage
        localStorage.setItem("registros", JSON.stringify(registros));

        document.getElementById('successMsg').textContent = 'Registro realizado com sucesso!';
        document.getElementById('registerForm').reset();
      });

      // Login
      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();
        const senha = document.getElementById('loginSenha').value;

        // Unir usuários fixos + registrados
        const todosUsuarios = [...users, ...registros.map(r => ({
          email: r.email,
          password: r.senha, // cuidado: senha no registro foi salva como "senha"
          role: r.role || "cliente",
          nome: r.nome
        }))];

        // Verificar login
        const usuario = todosUsuarios.find(u => u.email === email && u.password === senha);

        if (usuario) {
          document.getElementById('loginMsg').style.color = "green";
          document.getElementById('loginMsg').textContent = `Bem-vindo, ${usuario.nome}! Você entrou como ${usuario.role}.`;

          // Exemplo de redirecionamento por role
          if (usuario.role === "funcionario") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "index.html";
          }
        } else {
          document.getElementById('loginMsg').style.color = "red";
          document.getElementById('loginMsg').textContent = "Email ou senha inválidos!";
        }
      });
    </script>

</body>

</html>
